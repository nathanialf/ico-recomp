name: ci
on:
  push:
    branches: [main]
  pull_request:

# Five jobs, every one a gate. Each answers one question a change can break:
#   no-rom-gate     is any game data committed (tools/check_no_rom.sh)
#   translator      do the translator's tests and lints pass on the shipped
#                   config, which has no decomp input
#   linux           does the runtime build on Linux with and without the UI,
#                   and does every disc-free selftest pass, including the
#                   clean-room renderer's CPU selftests and the committed
#                   shader blobs' freshness check (a CMake ALL target)
#   windows-package does the mingw cross build produce the package the
#                   player receives (ico.exe, the paraLLEl-GS and SDL3 DLLs,
#                   README.txt, ui/), which is the build in dist/windows
#   macos           does the same source build and pass its selftests on
#                   arm64 macOS, which is the portability the Android and
#                   macOS targets rest on
#
# Removed on 2026-09-05, all continue-on-error and none ever green, so none
# of them could fail a merge and every one cost minutes a run: the MSVC
# builds (the shipped package is the mingw cross build), the software-Vulkan
# and WARP replay jobs of the native renderer (withdrawn from the player
# build that day; lavapipe on ubuntu-latest has no Vulkan 1.3 instance), the
# shader regeneration job (the freshness check now runs in every build), the
# MoltenVK app bundle (no Mac exists to act on its result). Their steps are
# in the history of this file at 9096334.

jobs:
  no-rom-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no game data committed
        run: bash tools/check_no_rom.sh --all

  translator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: unit tests
        working-directory: tools/recomp
        run: cargo test --release
      - name: lint
        working-directory: tools/recomp
        run: cargo clippy --all-targets -- -D warnings

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch the UI and RHI submodules
        run: |
          git submodule update --init third_party/rmlui third_party/freetype \
                                      third_party/volk third_party/Vulkan-Headers
      - name: configure and build (stub mode, UI, no live GS backend)
        # No disc image and no generated code exist here, so the runtime
        # builds in stub mode. ICORECOMP_UI=ON compiles the RmlUi overlay;
        # the native renderer is on by default and gives the four CPU
        # selftests below; the shader freshness check is an ALL target that
        # runs inside this build.
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DICORECOMP_PARALLEL_GS=OFF -DICORECOMP_UI=ON
          cmake --build build -j4
      - name: run every disc-free selftest
        # Every selftest target in CMakeLists.txt except the two that mount
        # the user's disc image and so cannot run in CI:
        # icorecomp-title-logo-selftest (a texture) and
        # icorecomp-ipu-selftest (the attract movie's stream). The ones that
        # write files take a fresh directory each.
        run: |
          set -e
          ICORECOMP_SETTINGS_SELFTEST_DIR=$(mktemp -d) ./build/icorecomp-settings-selftest
          ICORECOMP_LOG_SELFTEST_DIR=$(mktemp -d) ./build/icorecomp-log-selftest
          ICORECOMP_SAVES_DIR=$(mktemp -d) ./build/icorecomp-mc-selftest
          ./build/icorecomp-sif-selftest
          ./build/icorecomp-video-mode-selftest
          ./build/icorecomp-osd-config-selftest
          ./build/icorecomp-snd-pcm-selftest
          ./build/icorecomp-stick-shape-selftest
          ./build/icorecomp-mouse-look-selftest
          ./build/icorecomp-png-selftest
          ./build/icorecomp-vif1-selftest
          ./build/icorecomp-gif-widescreen-selftest
          ./build/icorecomp-gsring-selftest
          ./build/icorecomp-menu-nav-selftest
          ./build/icorecomp-achievements-selftest "$(mktemp -d)"
          ./build/icorecomp-gs-swizzle-selftest
          ./build/icorecomp-gif-decode-selftest
          ./build/icorecomp-gs-raster-selftest
          ./build/icorecomp-gs-texture-selftest

  windows-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: configure, build and install the package
        # The windows-mingw-cross preset is the build dist/windows ships:
        # paraLLEl-GS on, the UI on, the native renderer compiled for CI but
        # not selectable by the player. cmake/mingw-w64.cmake picks the
        # -posix drivers Ubuntu's mingw-w64 provides.
        run: |
          set -eo pipefail
          cmake --preset windows-mingw-cross 2>&1 | tee configure.log
          cmake --build --preset windows-mingw-cross -j4
          cmake --install build/windows-mingw-cross --prefix dist/windows-ci
      - name: check what landed in the package
        run: |
          set -e
          find dist/windows-ci -maxdepth 2 -print
          for f in ico.exe libicorecomp-parallel-gs.dll SDL3.dll README.txt ui; do
            test -e "dist/windows-ci/$f" || { echo "missing $f"; exit 1; }
          done
          for f in dxcompiler.dll dxil.dll; do
            if [ -e "dist/windows-ci/$f" ]; then
              echo "$f is installed again; update packaging/README.txt.in and docs/WINDOWS.md"
              exit 1
            fi
          done

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: fetch the UI submodules
        run: git submodule update --init third_party/rmlui third_party/freetype
      - name: configure and build (UI, no live GS backend)
        run: |
          cmake --preset macos-arm64-stub
          cmake --build --preset macos-arm64-stub -j4
      - name: run the disc-free selftests
        run: |
          set -e
          BUILD=build/macos-arm64-stub
          ICORECOMP_SETTINGS_SELFTEST_DIR=$(mktemp -d) "$BUILD/icorecomp-settings-selftest"
          ICORECOMP_LOG_SELFTEST_DIR=$(mktemp -d) "$BUILD/icorecomp-log-selftest"
          ICORECOMP_SAVES_DIR=$(mktemp -d) "$BUILD/icorecomp-mc-selftest"
          "$BUILD/icorecomp-sif-selftest"
          "$BUILD/icorecomp-menu-nav-selftest"
          "$BUILD/icorecomp-snd-pcm-selftest"
          "$BUILD/icorecomp-stick-shape-selftest"
          "$BUILD/icorecomp-mouse-look-selftest"
          "$BUILD/icorecomp-vif1-selftest"
          "$BUILD/icorecomp-gsring-selftest"
          "$BUILD/icorecomp-gif-widescreen-selftest"
          "$BUILD/icorecomp-video-mode-selftest"
          "$BUILD/icorecomp-osd-config-selftest"
          "$BUILD/icorecomp-achievements-selftest" "$(mktemp -d)"
